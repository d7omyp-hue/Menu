<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

img {
    width: 100%;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}
</style>
</head>

<body>

<img src="Page5.jpeg">
<img src="page2.jpg">
<img src="page3.jpg">
<img src="page4.jpg">
<img src="page1.jpg">
<img src="page6.jpg">
<img src="page7.jpg">
<img src="page8.jpg">
<img src="page9.jpg">

    
<script>
// منع التكبير
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
        e.preventDefault();
    }
    lastTouchEnd = now;
}, false);

// ======================
// النزول التلقائي
// ======================

let autoScroll = true;
let scrollSpeed = 0.6;      // السرعة
let idleTime = 10000;       // 10 ثواني

let lastInteraction = Date.now();

function userInteracted() {
    lastInteraction = Date.now();
    autoScroll = false;
}

[
"touchstart",
"touchmove",
"mousedown",
"wheel"
].forEach(event => {
    document.addEventListener(event, userInteracted, { passive: true });
});

setInterval(() => {

    // بعد 10 ثواني بدون لمس
    if (!autoScroll && Date.now() - lastInteraction >= idleTime) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(() => {
            autoScroll = true;
        }, 2000);

    }

    if (autoScroll) {

        window.scrollBy(0, scrollSpeed);

        // وصل للنهاية
        if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 5) {

            autoScroll = false;

            setTimeout(() => {

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                setTimeout(() => {
                    autoScroll = true;
                }, 2000);

            }, 3000);

        }

    }

},20);

</script>

</body>
</html>
